<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capture &amp; Pin</title>
<meta name="description" content="A sequence interaction prototype: load film, open the camera, set zoom and exposure, capture photos, and pin them from your gallery to the wall.">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
<aside id="panel" class="panel" aria-label="Step 2 background controls">
  <button id="panelToggle" class="ptoggle" type="button" aria-expanded="true" aria-controls="panelBody" aria-label="Background controls">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    <span>Background controls</span>
  </button>
  <div id="panelBody" class="pbody">
    <p class="pintro">Live settings for the Step 2 scene. Changes also show behind the Step 1 frame. Photos that are already captured stay as they were.</p>
    <div class="pgroups"></div>
    <div class="pactions">
      <button id="pReset" class="pbtn" type="button" title="Restart the background animation with the current settings">Reset state</button>
      <button id="pDefaults" class="pbtn" type="button" title="Put every control back to its default value">Restore defaults</button>
      <button id="copyPrompt" class="pbtn primary" type="button" title="Copy the current values as a prompt you can paste">Copy as prompt</button>
    </div>
  </div>
</aside>

<aside id="cpanel" class="panel right" aria-label="Camera settings" hidden>
  <button id="cpanelToggle" class="ptoggle" type="button" aria-expanded="true" aria-controls="cpanelBody" aria-label="Camera settings">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Camera settings</span>
  </button>
  <div id="cpanelBody" class="pbody"></div>
</aside>

<main class="wrap">
  <header class="head">
    <h1>Capture &amp; Pin</h1>
    <span class="count" id="count" aria-live="polite"></span>
  </header>

  <div class="stage" id="stage" tabindex="0" role="application" aria-label="Black screen. Pinch out with two fingers, scroll, or press plus to open the camera frame.">
    <svg id="svg" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
      </defs>
      <!-- live lens: exposure, film, grain (#lens) and depth of field (#dof), rebuilt from the camera settings -->
      <defs id="liveDefs"></defs>
      <rect width="680" height="470" fill="#000"/>

      <!-- Steps 1–2: the drifting, randomly changing landscape (from Study 02) -->
      <g id="worldL" class="layer" filter="url(#lens)"><g id="world"></g></g>
      <rect id="flash" width="680" height="470" fill="#fff" style="opacity:0"/>

      <!-- Step 1: Silky Frame Reveal -->
      <g id="fr" class="layer"></g>
      <g id="cue" class="layer" pointer-events="none"></g>

      <!-- Step 2: Sharp Shutter -->
      <g id="cam" class="layer off">
        <g id="br" filter="url(#sh)">
          <g id="b1" class="brk" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M240 163 L240 135 L268 135"/><path d="M412 135 L440 135 L440 163"/><path d="M440 307 L440 335 L412 335"/><path d="M268 335 L240 335 L240 307"/>
          </g>
          <g id="b2" class="brk" stroke-width="1.5" stroke-linecap="square">
            <path d="M240 235 H252"/><path d="M440 235 H428"/><path d="M340 135 V147"/><path d="M340 335 V323"/>
          </g>
        </g>
        <circle id="hint" class="ping" cx="340" cy="235" r="52"/>
        <g id="shutter" role="button" tabindex="-1" aria-label="Shutter: capture photo">
          <circle id="hit" cx="340" cy="235" r="62" fill="transparent"/>
          <circle class="ring" cx="340" cy="235" r="52" filter="url(#sh)"/>
          <circle id="disc" class="disc" cx="340" cy="235" r="40"/>
          <path id="chk" class="chk" d="M323 236 L335 248 L359 222" opacity="0"/>
        </g>
      </g>

      <!-- Step 3: Magnet Wall -->
      <g id="wallg" class="layer off">
        <rect class="wall-fill" width="680" height="470"/>
        <g class="wall-line" stroke-width="0.75">
          <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/><line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/><line x1="0" y1="420" x2="680" y2="420"/>
        </g>
        <g id="pinned"></g>
        <g transform="translate(0 80)">
          <g class="hand-s" stroke-width="20" stroke-linecap="round" fill="none">
            <line id="hf0" x1="308" y1="300" x2="306" y2="226"/>
            <line id="hf1" x1="330" y1="300" x2="330" y2="206"/>
            <line id="hf2" x1="352" y1="300" x2="354" y2="206"/>
            <line id="hf3" x1="374" y1="300" x2="378" y2="228"/>
            <line id="hth" x1="298" y1="332" x2="262" y2="290"/>
          </g>
          <rect class="hand" x="296" y="286" width="88" height="94" rx="28"/>
        </g>
        <g id="lines" class="dash" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round" fill="none" style="opacity:0">
          <line class="march" id="ml0"/><line class="march" id="ml1"/><line class="march" id="ml2"/>
        </g>
        <g id="held" role="button" tabindex="-1" style="cursor:grab;opacity:0">
          <rect id="hs" class="shadow" x="-56" y="-68" width="112" height="136"/>
          <g id="hc"></g>
        </g>
      </g>
    </svg>

    <!-- Step 0: film choice -->
    <div id="film" class="film" role="group" aria-labelledby="filmTitle">
      <p class="film-kicker">Step 1 · Load the camera</p>
      <h2 id="filmTitle">Choose your film</h2>
      <p class="film-sub">Click a roll to select it. The camera opens after you choose.</p>
      <div class="film-opts">
        <button type="button" class="film-card" data-film="color" aria-pressed="false">
          <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="8" y="14" width="64" height="52" rx="8" fill="#2b2b30"/><rect x="14" y="22" width="52" height="14" rx="3" fill="#e2593b"/><rect x="14" y="38" width="52" height="8" rx="2" fill="#f2b33d"/><rect x="14" y="48" width="52" height="8" rx="2" fill="#3f86c9"/><rect x="72" y="30" width="10" height="20" rx="2" fill="#555"/><path d="M82 34h30v12H82z" fill="#7a5a3a"/><path d="M86 34v12M92 34v12M98 34v12M104 34v12" stroke="#2b2b30" stroke-width="2"/></svg>
          <span class="film-name">Color film</span>
          <span class="film-desc">Full color: sky, sea and land in your palette</span>
          <span class="film-pick">Select</span>
        </button>
        <button type="button" class="film-card" data-film="bw" aria-pressed="false">
          <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="8" y="14" width="64" height="52" rx="8" fill="#2b2b30"/><rect x="14" y="22" width="52" height="14" rx="3" fill="#e8e8e8"/><rect x="14" y="38" width="52" height="8" rx="2" fill="#9a9a9a"/><rect x="14" y="48" width="52" height="8" rx="2" fill="#5a5a5a"/><rect x="72" y="30" width="10" height="20" rx="2" fill="#555"/><path d="M82 34h30v12H82z" fill="#4a4a4a"/><path d="M86 34v12M92 34v12M98 34v12M104 34v12" stroke="#2b2b30" stroke-width="2"/></svg>
          <span class="film-name">Black &amp; white film</span>
          <span class="film-desc">Classic grayscale with deep contrast</span>
          <span class="film-pick">Select</span>
        </button>
      </div>
    </div>

    <!-- Step 3 camera controls on the main screen -->
    <div id="camui" class="camui" hidden>
      <div id="apStrip" class="apstrip" role="radiogroup" aria-label="Aperture"></div>
      <div class="cambar">
        <button id="apBtn" class="apbtn" type="button" aria-expanded="false" aria-controls="apStrip" title="Aperture">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3l3.5 7.5M21 12l-8 .5M16.5 19.8L12 13M7.5 19.8l3-7M3 12h8M7.5 4.2L12 11"/></svg>
          <span id="apLabel">ƒ/2.8</span>
        </button>
        <div id="zooms" class="zooms" role="radiogroup" aria-label="Zoom"></div>
        <button id="galBtn" class="galbtn" type="button" hidden>
          <svg id="galThumb" viewBox="-46 -58 92 92" aria-hidden="true"></svg>
          <span id="galCount" class="badge">0</span>
        </button>
      </div>
    </div>

    <!-- Gallery -->
    <div id="gallery" class="gallery" role="dialog" aria-modal="true" aria-labelledby="galTitle" hidden>
      <div class="ghead">
        <h2 id="galTitle">Gallery</h2>
        <div class="gtools">
          <button id="galWall" class="gbtn" type="button">View wall</button>
          <button id="galClose" class="gbtn primary" type="button">Back to camera</button>
        </div>
      </div>
      <div id="galGrid" class="ggrid"></div>
    </div>

    <button id="restart" class="icon-btn" type="button" aria-label="Restart from the beginning" title="Restart">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><polyline points="4 4.5 4.5 8.5 8.5 8"/></svg>
    </button>
  </div>

  <div class="foot">
    <p id="status" class="hud" aria-live="polite"></p>
    <button id="more" class="text-btn" type="button" hidden>Back to camera</button>
  </div>
</main>
<script src="js/app.js?v=8"></script>
</body>
</html>
